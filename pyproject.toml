[project]
name = "dispute-desk"
version = "0.1.0"
description = "MCP server + agentic loop for bank dispute triage — a learning build"
requires-python = ">=3.10"

dependencies = [
    "mcp[cli]>=2.0.0",     # MCP 2.0: MCPServer (NOT FastMCP — renamed)
    "openai>=1.40",        # one client, two base_urls: OpenAI cloud + Ollama local
    "numpy>=1.26",         # cosine similarity for the embedding retriever
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Stage 3b (PyTorch cross-encoder reranker). Install torch from the CPU index:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
#   uv pip install -e ".[rerank]"
rerank = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
eval = ["deepeval>=2.0", "langfuse>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# seed.py holds aligned data tables that are meant to be read as tables.
# Wrapping them to 100 columns destroys the thing that makes them readable.
"data/seed.py" = ["E501"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
