<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispute Desk</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c2129;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --text-dim: #484f58;
    --green: #3fb950;
    --blue: #58a6ff;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --cyan: #39d2c0;
    --mono: "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.65rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--text-muted); font-weight: 400; }
  #provider-info {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  /* ── Main layout ── */
  main {
    display: grid;
    grid-template-columns: 240px 1fr 360px;
    flex: 1;
    overflow: hidden;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    #dispute-list, #proposal-panel { max-height: 35vh; }
  }

  /* ── Dispute list (left) ── */
  #dispute-list {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--surface);
  }
  .panel-heading {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 0.75rem 1rem 0.4rem;
  }
  .dispute-card {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .dispute-card:hover { background: var(--surface-2); }
  .dispute-card.active { background: var(--surface-2); border-left: 2px solid var(--blue); }
  #dispute-list.locked .dispute-card { opacity: 0.5; cursor: not-allowed; }
  #dispute-list.locked .dispute-card.active { opacity: 1; }
  #dispute-list.locked .dispute-card:hover { background: transparent; }
  .dispute-card .id {
    font-family: var(--mono);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--blue);
  }
  .dispute-card .meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }
  .dispute-card .category {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 500;
    padding: 0.1em 0.4em;
    border-radius: 3px;
    background: #1f2937;
    color: var(--cyan);
    margin-top: 0.25rem;
  }

  /* ── Trace panel (center) ── */
  #trace-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #trace-toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  #trace-toolbar .dispute-label {
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 600;
  }
  #btn-triage {
    padding: 0.3rem 0.85rem;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid var(--green);
    border-radius: 4px;
    background: transparent;
    color: var(--green);
    cursor: pointer;
    font-family: var(--sans);
    transition: background 0.15s;
  }
  #btn-triage:hover { background: rgba(63, 185, 80, 0.15); }
  #btn-triage:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-triage:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  #triage-status {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  #trace-log {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.55;
  }
  #trace-log:empty::before {
    content: "Select a dispute and click Run Triage to begin.";
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 0.85rem;
  }

  .trace-entry { margin-bottom: 0.15rem; }
  .trace-connect { color: var(--green); }
  .trace-step {
    color: var(--text-dim);
    margin-top: 0.65rem;
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .trace-tool-call { color: var(--blue); }
  .trace-tool-call .arrow { color: var(--cyan); }
  .trace-reasoning {
    color: var(--purple);
    padding: 0.35rem 0.75rem;
    margin: 0.2rem 0;
    border-left: 2px solid var(--purple);
    background: rgba(188, 140, 255, 0.05);
    font-family: var(--sans);
    font-size: 0.78rem;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }
  .trace-reasoning::before {
    content: "reasoning ";
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--purple);
    opacity: 0.6;
  }
  .tool-args {
    margin: 0.15rem 0 0 1.5rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .trace-tool-result {
    color: var(--text-muted);
    padding-left: 1.5rem;
    cursor: pointer;
  }
  .trace-tool-result .result-header {
    color: var(--text-dim);
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .trace-tool-result .result-body {
    max-height: 7em;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.75rem;
    margin: 0.1rem 0 0;
    padding: 0;
    transition: max-height 0.15s ease;
  }
  .trace-tool-result.expanded .result-body { max-height: none; }
  .trace-tool-result:not(.expanded) .result-header::after {
    content: "  ▸ click to expand";
    font-weight: 400;
    font-size: 0.62rem;
    opacity: 0.5;
    text-transform: none;
    letter-spacing: 0;
  }
  .trace-tool-result.expanded .result-header::after {
    content: "  ▾ click to collapse";
    font-weight: 400;
    font-size: 0.62rem;
    opacity: 0.5;
    text-transform: none;
    letter-spacing: 0;
  }
  .trace-nudge, .trace-chase, .trace-correction { color: var(--yellow); }
  .trace-repair { color: var(--yellow); padding-left: 1.5rem; }
  .trace-final { color: var(--text); margin-top: 0.5rem; }
  .trace-complete { color: var(--green); margin-top: 0.5rem; font-weight: 600; }
  .trace-error { color: var(--red); margin-top: 0.5rem; }
  .trace-step-limit { color: var(--red); }

  /* ── Proposal panel (right) ── */
  #proposal-panel {
    border-left: 1px solid var(--border);
    overflow-y: auto;
    background: var(--surface);
    padding: 0 0 1rem;
  }
  #proposal-content { padding: 0 1rem; }
  #proposal-content:empty::before {
    content: "No proposal yet. Run a triage to see the result here.";
    color: var(--text-dim);
    font-size: 0.82rem;
    display: block;
    padding-top: 0.5rem;
  }

  .proposal-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.85rem;
    margin-top: 0.5rem;
  }
  .proposal-card h3 {
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .proposal-card .field {
    font-size: 0.78rem;
    margin-bottom: 0.35rem;
    display: grid;
    grid-template-columns: 5.5rem 1fr;
    gap: 0.25rem;
  }
  .proposal-card .field .label {
    color: var(--text-dim);
    text-transform: uppercase;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding-top: 0.1em;
  }
  .proposal-card .field .value {
    color: var(--text);
    word-break: break-word;
  }

  .chip {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 0.1em 0.45em;
    border-radius: 3px;
  }
  .chip-pending { background: rgba(210,153,34,0.2); color: var(--yellow); }
  .chip-approved { background: rgba(63,185,80,0.2); color: var(--green); }
  .chip-denied { background: rgba(248,81,73,0.2); color: var(--red); }

  .approval-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.75rem;
    align-items: center;
  }
  .approval-bar input {
    flex: 1;
    min-width: 80px;
    padding: 0.3rem 0.5rem;
    font-size: 0.78rem;
    font-family: var(--sans);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
  }
  .approval-bar input:focus { outline: 1px solid var(--blue); border-color: var(--blue); }
  .btn-approve, .btn-deny {
    padding: 0.3rem 0.65rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid;
    background: transparent;
    font-family: var(--sans);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-approve { border-color: var(--green); color: var(--green); }
  .btn-approve:hover { background: rgba(63,185,80,0.15); }
  .btn-deny { border-color: var(--red); color: var(--red); }
  .btn-deny:hover { background: rgba(248,81,73,0.15); }
  .btn-approve:focus-visible, .btn-deny:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }

  .pending-list {
    margin-top: 0.75rem;
  }
  .pending-item {
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
  }
  .pending-item:last-child { border-bottom: none; }
  .pending-item .disp { color: var(--cyan); font-family: var(--mono); }

  /* ── Chat bar ── */
  #chat-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  #chat-bar input {
    flex: 1;
    padding: 0.35rem 0.6rem;
    font-size: 0.82rem;
    font-family: var(--sans);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
  }
  #chat-bar input:focus { outline: 1px solid var(--blue); border-color: var(--blue); }
  #chat-bar input:disabled { opacity: 0.35; }
  #btn-chat {
    padding: 0.35rem 0.85rem;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid var(--blue);
    border-radius: 4px;
    background: transparent;
    color: var(--blue);
    cursor: pointer;
    font-family: var(--sans);
    white-space: nowrap;
  }
  #btn-chat:hover { background: rgba(88, 166, 255, 0.15); }
  #btn-chat:disabled { opacity: 0.35; cursor: not-allowed; }
  #btn-chat:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .trace-user-msg {
    color: var(--green);
    margin-top: 0.65rem;
    font-family: var(--sans);
    font-size: 0.82rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .trace-user-msg::before {
    content: "you › ";
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: 0.6;
  }
  .trace-chat-reply {
    color: var(--text);
    margin-top: 0.25rem;
    padding: 0.35rem 0.75rem;
    border-left: 2px solid var(--blue);
    font-family: var(--sans);
    font-size: 0.82rem;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
  }
</style>
</head>
<body>

<header>
  <h1>Dispute Desk <span>/ trace viewer</span></h1>
  <span id="provider-info"></span>
</header>

<main>
  <div id="dispute-list">
    <div class="panel-heading">Disputes</div>
  </div>

  <div id="trace-panel">
    <div id="trace-toolbar">
      <span class="dispute-label" id="selected-label">No dispute selected</span>
      <button id="btn-triage" disabled>Run Triage</button>
      <span id="triage-status"></span>
    </div>
    <div id="trace-log"></div>
    <div id="chat-bar">
      <input type="text" id="chat-input" placeholder="Ask a follow-up..." disabled>
      <button id="btn-chat" disabled>Send</button>
    </div>
  </div>

  <div id="proposal-panel">
    <div class="panel-heading">Proposals</div>
    <div id="proposal-content"></div>
  </div>
</main>

<script>
// ── State ──────────────────────────────────────────────────────────

let disputes = [];
let selected = null;
let running = false;
let sessionId = null;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

// ── Boot ───────────────────────────────────────────────────────────

async function init() {
  try {
    const res = await fetch("/api/disputes");
    disputes = await res.json();
    renderDisputeList();
    loadProposals();
  } catch (e) {
    log("trace-error", "Failed to load disputes: " + e.message);
  }
}

// ── Dispute list ───────────────────────────────────────────────────

function renderDisputeList() {
  const list = $("#dispute-list");
  list.innerHTML = '<div class="panel-heading">Disputes</div>';

  for (const d of disputes) {
    const card = document.createElement("div");
    card.className = "dispute-card" + (selected === d.id ? " active" : "");
    card.innerHTML =
      '<div class="id">' + esc(d.id) + "</div>" +
      '<div class="meta">' + esc(d.name) + " &middot; " + esc(d.account_type) + "</div>" +
      '<div class="category">' + esc(d.category) + "</div>";
    card.onclick = () => selectDispute(d.id);
    list.appendChild(card);
  }
}

function selectDispute(id) {
  if (running) return;
  selected = id;
  sessionId = null;
  renderDisputeList();
  $("#selected-label").textContent = id;
  $("#btn-triage").disabled = false;
  $("#trace-log").innerHTML = "";
  $("#triage-status").textContent = "";
  $("#chat-input").disabled = true;
  $("#btn-chat").disabled = true;
}

// ── Triage (SSE stream) ───────────────────────────────────────────

$("#btn-triage").onclick = () => runTriage();

async function runTriage() {
  if (!selected || running) return;
  running = true;
  $("#btn-triage").disabled = true;
  $("#triage-status").textContent = "running...";
  $("#trace-log").innerHTML = "";
  $("#dispute-list").classList.add("locked");

  try {
    const res = await fetch("/api/triage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dispute_id: selected }),
    });

    // Read the SSE stream — same pattern as Waku's render.js
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        try {
          handleEvent(JSON.parse(line.slice(5).trim()));
        } catch (e) {
          // malformed JSON frame — skip
        }
      }
    }
  } catch (e) {
    log("trace-error", "Stream failed: " + e.message);
  }

  running = false;
  $("#btn-triage").disabled = false;
  $("#dispute-list").classList.remove("locked");
  loadProposals();
}

// ── Chat (follow-up) ─────────────────────────────────────────────

$("#btn-chat").onclick = () => sendChat();
$("#chat-input").onkeydown = (e) => { if (e.key === "Enter") sendChat(); };

async function sendChat() {
  const input = $("#chat-input");
  const message = input.value.trim();
  if (!message || !sessionId) return;
  input.value = "";
  input.disabled = true;
  $("#btn-chat").disabled = true;

  log("trace-user-msg", esc(message));

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        try {
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.kind === "chat_reply") {
            log("trace-chat-reply", esc(ev.text));
          } else if (ev.kind === "error") {
            log("trace-error", "✗ " + esc(ev.message));
          }
        } catch (_) {}
      }
    }
  } catch (e) {
    log("trace-error", "Chat failed: " + esc(e.message));
  }

  input.disabled = false;
  $("#btn-chat").disabled = false;
  input.focus();
}

// ── Event handler ─────────────────────────────────────────────────

function handleEvent(ev) {
  switch (ev.kind) {
    case "connect":
      log("trace-connect", "● Connected to MCP server");
      log("trace-connect", "  " + ev.tools.length + " tools: " + ev.tools.map(t => esc(t)).join(", "));
      log("trace-connect", "  provider: " + esc(ev.provider));
      break;

    case "step":
      log("trace-step", "Step " + ev.step);
      break;

    case "reasoning":
      log("trace-reasoning", esc(ev.text));
      break;

    case "tool_call":
      const argsJson = JSON.stringify(ev.args, null, 2);
      const argsInline = JSON.stringify(ev.args);
      if (argsInline.length < 80) {
        log("trace-tool-call",
          '<span class="arrow">→</span> <strong>' + esc(ev.name) + '</strong>(' + esc(argsInline) + ')');
      } else {
        log("trace-tool-call",
          '<span class="arrow">→</span> <strong>' + esc(ev.name) + '</strong>' +
          '<pre class="tool-args">' + esc(argsJson) + '</pre>');
      }
      break;

    case "tool_result":
      const resultEl = document.createElement("div");
      resultEl.className = "trace-entry trace-tool-result";

      const headerEl = document.createElement("div");
      headerEl.className = "result-header";
      headerEl.textContent = "← " + ev.name;

      const bodyEl = document.createElement("pre");
      bodyEl.className = "result-body";
      try {
        bodyEl.textContent = JSON.stringify(JSON.parse(ev.result), null, 2);
      } catch (_) {
        bodyEl.textContent = ev.result;
      }

      resultEl.appendChild(headerEl);
      resultEl.appendChild(bodyEl);
      resultEl.onclick = () => resultEl.classList.toggle("expanded");
      $("#trace-log").appendChild(resultEl);
      autoScroll();
      return;

    case "nudge":
      log("trace-nudge", "⚠ Budget nudge at step " + ev.step + " — no decision yet, pushing model to decide");
      break;

    case "chase":
      log("trace-chase", "⚠ Completion chase — model finished without calling terminal tool");
      break;

    case "correction":
      log("trace-correction", "⚠ Model wrote tool call as text — correcting");
      break;

    case "repair":
      log("trace-repair", "↻ Argument repaired: " + esc(ev.detail));
      break;

    case "final":
      log("trace-final", esc(ev.text));
      break;

    case "complete":
      const tokens = (ev.prompt_tokens || 0) + (ev.completion_tokens || 0);
      let summary = "✓ Complete — " + ev.steps + " steps, " +
                     ev.seconds + "s, " + tokens.toLocaleString() + " tokens";
      if (ev.error) summary += "\n  error: " + esc(ev.error);
      log(ev.error ? "trace-error" : "trace-complete", summary);
      $("#triage-status").textContent =
        ev.steps + " steps · " + ev.seconds + "s · " + tokens.toLocaleString() + " tok";
      if (ev.session_id) {
        sessionId = ev.session_id;
        $("#chat-input").disabled = false;
        $("#btn-chat").disabled = false;
        $("#chat-input").placeholder = "Ask a follow-up about this triage...";
        $("#chat-input").focus();
      }
      break;

    case "step_limit":
      log("trace-step-limit", "✗ Hit step limit (" + ev.max_steps + ")");
      break;

    case "error":
      log("trace-error", "✗ Error: " + esc(ev.message));
      break;
  }
}

// ── Trace log helpers ─────────────────────────────────────────────

function log(cls, html) {
  const el = document.createElement("div");
  el.className = "trace-entry " + cls;
  el.innerHTML = html;
  $("#trace-log").appendChild(el);
  autoScroll();
}

function autoScroll() {
  const log = $("#trace-log");
  log.scrollTop = log.scrollHeight;
}

// ── Proposals ─────────────────────────────────────────────────────

async function loadProposals() {
  try {
    const res = await fetch("/api/proposals");
    const proposals = await res.json();
    renderProposals(proposals);
  } catch (e) {
    // silent — proposals panel is secondary
  }
}

function renderProposals(proposals) {
  const container = $("#proposal-content");

  if (!proposals.length) {
    container.innerHTML = "";
    return;
  }

  let html = "";
  for (const p of proposals) {
    const statusCls = "chip-" + p.status;
    const isPending = p.status === "pending";

    html += '<div class="proposal-card">';
    html += '<h3>' + esc(p.dispute_id) + ' <span class="chip ' + statusCls + '">' + esc(p.status) + "</span></h3>";
    html += field("Disposition", esc(p.disposition));
    html += field("Amount", p.amount != null ? "$" + Number(p.amount).toFixed(2) : "—");
    html += field("Citations", esc(p.citations));
    html += field("Rationale", esc(p.rationale));

    if (p.verdict) {
      const vc = p.verdict === "pass" ? "color:var(--green)" : "color:var(--red)";
      html += field("Verdict", '<span style="' + vc + '">' + esc(p.verdict.toUpperCase()) + "</span>" +
        (p.verdict_reasons ? " — " + esc(p.verdict_reasons) : ""));
    }

    if (p.decided_by) {
      html += field("Decided by", esc(p.decided_by));
    }

    if (isPending) {
      html +=
        '<div class="approval-bar">' +
        '<input type="text" placeholder="Your name" id="by-' + p.id + '">' +
        '<button class="btn-approve" onclick="doApprove(' + p.id + ')">Approve</button>' +
        '<button class="btn-deny" onclick="doDeny(' + p.id + ')">Deny</button>' +
        "</div>";
    }

    html += "</div>";
  }

  container.innerHTML = html;
}

function field(label, value) {
  return '<div class="field"><span class="label">' + label + '</span><span class="value">' + value + "</span></div>";
}

// ── Approval actions ──────────────────────────────────────────────

async function doApprove(id) { await doDecide(id, "approved"); }
async function doDeny(id) { await doDecide(id, "denied"); }

async function doDecide(proposalId, decision) {
  const byInput = document.getElementById("by-" + proposalId);
  const by = (byInput && byInput.value || "").trim();
  if (!by) {
    alert("Enter your name before deciding.");
    return;
  }

  try {
    const res = await fetch("/api/approve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ proposal_id: proposalId, decision, by }),
    });
    const result = await res.json();
    if (!result.ok) {
      alert("Error: " + result.error);
    }
    loadProposals();
  } catch (e) {
    alert("Request failed: " + e.message);
  }
}

// ── Utilities ─────────────────────────────────────────────────────

function esc(s) {
  if (s == null) return "";
  const d = document.createElement("div");
  d.textContent = String(s);
  return d.innerHTML;
}

function truncate(s, n) {
  if (!s) return "";
  return s.length > n ? s.slice(0, n) + "…" : s;
}

// ── Start ─────────────────────────────────────────────────────────

init();
</script>
</body>
</html>
